<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h3 mb-4">Quản lý sản phẩm cửa hàng điện thoại</h1>
      <div class="row g-4">
        <section class="col-12 col-md-4" aria-labelledby="formTitle">
          <h2 class="h5 mb-3" id="formTitle">Thêm sản phẩm</h2>
          <form id="itemForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="name">Tên sản phẩm</label>
              <input class="form-control" type="text" id="name" name="name">
            </div>
            <div class="mb-3">
              <label class="form-label" for="brand">Hãng</label>
              <input class="form-control" type="text" id="brand" name="brand">
            </div>
            <div class="mb-3">
              <label class="form-label" for="price">Giá bán</label>
              <input class="form-control" type="number" id="price" name="price" step="any">
            </div>
            <div class="mb-3">
              <label class="form-label" for="image">URL hình ảnh</label>
              <input class="form-control" type="url" id="image" name="image" placeholder="https://example.com/phone.jpg">
            </div>
            <div class="mb-3">
              <label class="form-label" for="description">Mô tả sản phẩm</label>
              <textarea class="form-control" id="description" name="description" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label" for="dateAdded">Ngày nhập</label>
              <input class="form-control" type="date" id="dateAdded" name="dateAdded">
            </div>
            <button class="btn btn-primary" type="button" id="saveBtn">Thêm sản phẩm</button>
          </form>
        </section>
        <section class="col-12 col-md-8" aria-labelledby="listTitle">
          <h2 class="h5 mb-3" id="listTitle">Danh sách sản phẩm</h2>
          <div class="mb-3">
            <label class="form-label" for="sortOrder">Sắp xếp theo giá bán</label>
            <select class="form-select" id="sortOrder">
              <option value="">Chọn thứ tự</option>
              <option value="asc">Giá tăng dần</option>
              <option value="desc">Giá giảm dần</option>
            </select>
          </div>
          <div class="d-flex flex-wrap align-items-center gap-3 mb-3">
            <button type="button" id="deleteSelectedBtn" class="btn btn-danger" disabled>Xóa các sản phẩm đã chọn</button>
            <span id="selectedCount" class="small text-secondary" aria-live="polite">Đã chọn 0 sản phẩm</span>
          </div>
          <div id="products" class="row g-4"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
